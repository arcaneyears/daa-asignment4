name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run JUnit tests
        run: mvn -B test
      - name: Run the experiment (quick sizes)
        run: mvn -B -q compile exec:java -Dexec.args="--quick --out target/ci-results"
